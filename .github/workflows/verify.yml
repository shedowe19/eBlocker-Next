name: Monorepo verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_credentials.py
      - run: python3 -m unittest discover -s tests -v
      - run: git diff --check
  build-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.13.0'
      - run: node apps/core/eblocker-ui/tools/task-completion.test.js
  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [services/coredns, services/dyndns, tools/environment-simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: '${{ matrix.component }}/go.sum'
      - run: go test ./...
        working-directory: '${{ matrix.component }}'
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: bash build/debian/maven-ci.sh test
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libnet1-dev libpcap-dev libhiredis-dev
      - run: make
        working-directory: services/network-tools
